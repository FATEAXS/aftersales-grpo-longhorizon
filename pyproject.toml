[project]
name = "aftersales-grpo"
version = "0.1.0"
description = "面向长程售后客服 Agent 的可复现后训练与评测项目（教师轨迹 → LoRA SFT → veRL 在线 GRPO → Final-100 Clean 评测）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# 训练与评测在 Linux GPU 机器上通过 extras 安装，核心环境保持轻量。
training = [
    "torch>=2.4",
    "transformers>=4.51,<5",
    "peft>=0.15,<1",
    "accelerate>=1,<2",
    "datasets>=3",
]
grpo = [
    "verl==0.8.0",
    "vllm==0.9.1",
    "torch>=2.4",
    "transformers>=4.51,<5",
    "peft>=0.15,<1",
    "accelerate>=1,<2",
    "datasets>=3",
    "hydra-core>=1.3",
    "tensordict",
]
parquet = ["pandas>=2", "pyarrow>=15"]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
