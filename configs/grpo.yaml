# 售后 Agent GRPO 配置（veRL 0.8，单卡 24GB RTX 3090 验证口径）
hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: ${oc.env:AFTERSALE_TRAIN_FILE}
  val_files: ${oc.env:AFTERSALE_VAL_FILE}
  train_batch_size: 2
  val_batch_size: 2
  max_prompt_length: 2048
  max_response_length: 10240
  return_raw_chat: true
  filter_overlong_prompts: true
  truncation: error

actor_rollout_ref:
  model:
    path: ${oc.env:AFTERSALE_MODEL_PATH}
    trust_remote_code: true
    enable_gradient_checkpointing: true
    use_remove_padding: false
    lora_rank: 16
    lora_alpha: 32
    target_modules: all-linear
    lora:
      merge: true
    override_config:
      attn_implementation: sdpa
  actor:
    ppo_mini_batch_size: 2
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: 12288
    use_dynamic_bsz: false
    freeze_vision_tower: true
    loss_agg_mode: token-mean
    clip_ratio_low: 0.20
    clip_ratio_high: 0.20
    entropy_coeff: 0.0
    calculate_entropy: true
    use_kl_loss: false
    kl_loss_coef: 0.0
    kl_loss_type: low_var_kl
    optim:
      lr: 1.0e-6
      lr_warmup_steps_ratio: 0.05
    fsdp_config:
      optimizer_offload: true
      param_offload: true
  rollout:
    name: vllm
    mode: async
    n: 4
    temperature: 0.7
    top_p: 0.9
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.40
    max_num_seqs: 8
    max_model_len: 12288
    max_num_batched_tokens: 12288
    free_cache_engine: true
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 12288
    log_prob_use_dynamic_bsz: false
    agent:
      num_workers: 8
      default_agent_loop: aftersale_tool_agent
      agent_loop_config_path: ${oc.env:AFTERSALE_GRPO_ROOT}/configs/agent_loop.yaml
      tool_config_path: ${oc.env:AFTERSALE_GRPO_ROOT}/configs/tools.json
    multi_turn:
      enable: true
      format: qwen3_coder
      max_user_turns: 30
      max_assistant_turns: 30
      max_parallel_calls: 1
      max_tool_response_length: 4200

trainer:
  total_epochs: 1
  total_training_steps: ${oc.env:AFTERSALE_GRPO_STEPS,120}
  save_freq: ${oc.env:AFTERSALE_GRPO_SAVE_FREQ,20}
  test_freq: 20
  project_name: aftersales_grpo
  experiment_name: ${oc.env:AFTERSALE_EXPERIMENT_NAME,grpo_v1}
  logger: ["console"]
  nnodes: 1
  n_gpus_per_node: 1

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
